<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting · WebPulse Media</title>
    <script>

      window.location.replace(`${window.location.origin}/?p=${encodeURIComponent(path)}${window.location.hash}`)
    </script>
